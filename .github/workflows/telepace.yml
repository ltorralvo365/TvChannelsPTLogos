name: Update Telepace Stream

on:
  schedule:
    # Corre automaticamente de 9 em 9 minutos
    - cron: '*/9 * * * *'
  # Permite correr manualmente no separador Actions do GitHub
  workflow_dispatch:

jobs:
  update-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tor and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          sudo service tor start
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Run Extraction Script
        run: |
          # Aguarda 5 segundos para o circuito do Tor estabelecer ligação
          sleep 5
          
          # Executa o teu script na pasta scripts/
          bash scripts/script.sh

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add streams/playlist.m3u
          git commit -m "Auto-update Telepace 1 stream URL [skip ci]" || exit 0
          git push