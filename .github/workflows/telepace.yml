name: Atualizar Streams Telepace

on:
  schedule:
    # Corre de 2 em 2 horas
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extrair URLs das Streams e Gerar M3U8s
        run: |
          python telepace1.py
          python telepace2.py

      - name: Publicar M3U8s Atualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          # Guardar ambos os ficheiros gerados na pasta temporaria
          tmp_m3u1="$(mktemp)"
          tmp_m3u2="$(mktemp)"
          cp telepace1.m3u8 "$tmp_m3u1"
          cp telepace2.m3u8 "$tmp_m3u2"
          
          # Sincronizar com a branch remota sem conflitos
          git fetch origin main
          git reset --hard origin/main
          
          # Repor os dois ficheiros atualizados
          cp "$tmp_m3u1" telepace1.m3u8
          cp "$tmp_m3u2" telepace2.m3u8
          rm -f "$tmp_m3u1" "$tmp_m3u2"
          
          # Adicionar ambos ao staging do Git
          git add telepace1.m3u8 telepace2.m3u8
          
          if git diff --cached --quiet; then
            echo 'Sem alteracoes nas streams'
          else
            git commit -m 'Atualizar URLs das streams Telepace 1 e 2'
            git push origin main
          fi
