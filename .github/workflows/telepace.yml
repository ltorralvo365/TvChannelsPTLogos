name: Update Telepace Stream

on:
  schedule:
    # Executa automaticamente de 9 em 9 minutos
    - cron: '*/9 * * * *'
  # Permite a execução manual no separador Actions do GitHub
  workflow_dispatch:

jobs:
  update-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tor, yt-dlp and curl-cffi
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          python -m pip install --upgrade pip
          pip install yt-dlp curl-cffi

      - name: Configure Tor Exit Nodes
        run: |
          # Configura o Tor para priorizar nós de saída europeus (PT, ES, FR, DE)
          echo "StrictNodes 0" | sudo tee -a /etc/tor/torrc
          echo "ExitNodes {pt},{es},{fr},{de}" | sudo tee -a /etc/tor/torrc
          sudo service tor restart
          
          # Aguarda 5 segundos para o circuito do Tor estabelecer a ligação
          sleep 5

      - name: Run Extraction Script
        run: |
          # Executa o script localizado na pasta scripts/
          bash scripts/script.sh

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add streams/playlist.m3u
          git commit -m "Auto-update Telepace stream URL [skip ci]" || exit 0
          git push
